	<style>


		/* these rules change the whole page */

			color: rgba(139, 197, 173, 0.267);
		}
	    p1 {

			margin-bottom: 35px;
        }
		div {
			font-size: 30px;

			margin-top: -3px;
			margin-bottom: 35px;
        }


	
		h1 {
			color: rgba(139, 197, 173, 0.267);
			text-align: center;
			font-size: 117px;

			/* negative margins decrease space between lines */
			margin-top: 120px;

		}
		
		h2 {
			color: rgba(64, 90, 79, 0.267);

			}

</head>

<body>

    <h1>UNPROFESSIONAL DECISIONS</h1>

    <div class="money-section">
        <h2 id="h2.static-text">$1</h2>
        <img src="money.png" class="center-img" alt="Money Illustration" onclick="generateMoney()">
    </div>




    <script src="./assets/main.js"></script>

   <script>
let currentAmount = 1;

function generateMoney() {
    // Chance of a big drop (10%)
    const dropChance = Math.random();

    if (dropChance < 0.10) {
        // Big drop: lose 30% to 60%
        const dropPercent = Math.random() * 0.30 + 0.30;
        currentAmount = Math.max(1, Math.floor(currentAmount * (1 - dropPercent)));
    } else {
        // Exponential growth: multiply by 1.1 to 1.5
        const growthFactor = 1.1 + Math.random() * 0.4;
        currentAmount = Math.floor(currentAmount * growthFactor) + 1;
    }

    document.getElementById("moneyText").textContent = "$" + currentAmount;
}
</script>


</body>
